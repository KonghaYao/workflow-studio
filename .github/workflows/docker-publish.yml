name: Docker Publish

# 构建并推送三个自建镜像到 GHCR（其余 mysql/redis/es/minio/etcd/milvus/nsq 均为第三方镜像，无需构建）：
#   ghcr.io/<owner>/<repo>-server     ← backend/Dockerfile   （Go 服务，对应 coze-server）
#   ghcr.io/<owner>/<repo>-web        ← frontend/Dockerfile  （nginx 前端，根路径部署，对应 coze-web）
#   ghcr.io/<owner>/<repo>-web-canvas ← frontend/Dockerfile  （同上，但 WORKFLOW_CANVAS_BASE=/workflow-canvas/）
# -web 与 -web-canvas 同 commit 同 tag：下游可用同一个 tag 引用 server 与画布子路径变体。
on:
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image_suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: server
            dockerfile: backend/Dockerfile
          - image_suffix: web
            dockerfile: frontend/Dockerfile
            build_args: WORKFLOW_CANVAS_BASE=/
          # 画布子路径变体：与 -web 同源码同 tag，仅构建参数不同（资源前缀 + 路由 basename 切到 /workflow-canvas/）
          - image_suffix: web-canvas
            dockerfile: frontend/Dockerfile
            build_args: WORKFLOW_CANVAS_BASE=/workflow-canvas/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 前端镜像需要 rush install + rush build，runner 默认磁盘较紧张
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 镜像名必须全小写，owner 可能含大写字母
      - name: Compute image name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${owner}/${repo}-${{ matrix.image_suffix }}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,scope=${{ matrix.image_suffix }},mode=max

      - name: Job summary
        run: |
          {
            echo "### ${{ matrix.image_suffix }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
